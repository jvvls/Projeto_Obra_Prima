services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongo:27017/obraprima
      JWT_SECRET: dev-secret-change-me
      PORT: "4000"
      FRONTEND_ORIGIN: http://localhost:5173
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    depends_on:
      - mongo

volumes:
  mongo_data:
